[package]
name = "mambofinance"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Local-first personal finance ledger with a MamboUI TUI and MCP tools"
license = "AGPL-3.0-only OR LicenseRef-Commercial"
repository = "https://github.com/ProjectMambo/MamboFinance"
readme = "README.md"

[dependencies]
axum = "0.8"
crossterm = "0.28"
mambo-ui = { git = "https://github.com/ProjectMambo/MamboUI", rev = "357f6c55bb5e0b8a843ae12437cfe39646abbaab" }
rmcp = { version = "3.11", features = ["schemars", "transport-streamable-http-server"] }
rusqlite = { version = "0.43", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile = "3"
tower = "0.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
